name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Builds and tests the React console (frontend-maven-plugin), then Java unit + Spring web tests.
      - run: ./mvnw -B package
      - run: python3 scripts/integration_test.py
      - run: java -Xmx512m -cp target/classes:target/test-classes dev.conductor.tools.ChaosHarness 25 20261020 benchmarks/chaos-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-results
          path: benchmarks/chaos-ci.json

  aws-emulated:
    # DynamoDB, SQS, S3 and EventBridge behaviour against LocalStack. Functional, not performance, evidence.
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.4.0
        env:
          SERVICES: dynamodb,sqs,s3,events
        ports: ["4566:4566"]
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      CONDUCTOR_IT_AWS_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4566/_localstack/health && break; sleep 2; done
      - run: ./mvnw -B package -Dtest='*Test,DynamoEngineIT'
      - run: python3 scripts/integration_test.py --store dynamodb

  docker:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-only-token-with-at-least-24-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --scale worker=2
      - run: python3 scripts/smoke_test.py http://127.0.0.1:8080
      - if: always()
        run: docker compose logs --tail 200 && docker compose down

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run synth -- --quiet
